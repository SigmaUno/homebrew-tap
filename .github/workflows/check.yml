name: Validate casks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install the tap
        run: brew tap SigmaUno/tap
      - name: Use the checked-out casks
        run: cp Casks/*.rb "$(brew --repository sigmauno/tap)/Casks/"
      - name: Check style and online metadata
        run: |
          for file in Casks/*.rb; do
            token="$(basename "$file" .rb)"
            brew style --cask "sigmauno/tap/$token"
            if [[ "$token" == sigma-dock-preview ]]; then
              brew audit --cask --online --except=github_prerelease_version "sigmauno/tap/$token"
            else
              brew audit --cask --online "sigmauno/tap/$token"
            fi
          done
      - name: Exercise install, CLI, daemon and UI closure
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/SigmaUno/sigma-dock/858b98ce5b6a/scripts/macos_bundle_smoke.py' -o "$RUNNER_TEMP/bundle-smoke.py"
          for file in Casks/*.rb; do
            token="$(basename "$file" .rb)"
            brew install --cask "sigmauno/tap/$token"
            sdk --help
            python3 "$RUNNER_TEMP/bundle-smoke.py" '/Applications/SigmaDock.app'
            brew upgrade --cask "sigmauno/tap/$token"
            brew reinstall --cask "sigmauno/tap/$token"
            sdk --help
            brew uninstall --cask "sigmauno/tap/$token"
          done
      - name: Uninstall
        if: always()
        run: |
          for file in Casks/*.rb; do
            brew uninstall --cask "sigmauno/tap/$(basename "$file" .rb)" || true
          done
