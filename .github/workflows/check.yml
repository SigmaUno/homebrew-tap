name: Validate casks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install the tap
        run: brew tap SigmaUno/tap
      - name: Use the checked-out casks
        run: cp Casks/*.rb "$(brew --repository sigmauno/tap)/Casks/"
      - name: Check style and online metadata
        run: |
          brew style --cask sigmauno/tap/sigma-dock-preview
          brew audit --cask --online sigmauno/tap/sigma-dock-preview
      - name: Exercise install, CLI, daemon and UI closure
        run: |
          brew install --cask sigmauno/tap/sigma-dock-preview
          sdk --help
          app='/Applications/SigmaDock.app'
          curl -fsSL 'https://raw.githubusercontent.com/SigmaUno/sigma-dock/858b98ce5b6a/scripts/macos_bundle_smoke.py' -o "$RUNNER_TEMP/bundle-smoke.py"
          python3 "$RUNNER_TEMP/bundle-smoke.py" "$app"
          brew upgrade --cask sigmauno/tap/sigma-dock-preview
          brew reinstall --cask sigmauno/tap/sigma-dock-preview
          sdk --help
      - name: Uninstall
        if: always()
        run: brew uninstall --cask sigmauno/tap/sigma-dock-preview || true
